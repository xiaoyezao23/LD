<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>上海市皮肤病医院专科AI能力中台</title>
  <style>
    :root{--blue:#1f6fb2;--blue-2:#eaf4fb;--teal:#1f9a8a;--teal-2:#e9f7f5;--gray:#f4f7f9;--line:#dce5eb;--text:#1f2d3d;--muted:#657786;--warn:#b7791f;--red:#c53030;--green:#2f855a;--shadow:0 8px 22px rgba(31,45,61,.07)}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;color:var(--text);background:#f7fafc} button,input,select{font:inherit} button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:#fff;border:1px solid var(--line);color:var(--text)} button.primary{background:var(--blue);border-color:var(--blue);color:#fff} button.teal{background:var(--teal);border-color:var(--teal);color:#fff} button.ghost{background:transparent} button.warn{border-color:#f6d08a;background:#fff8e8;color:#8a5a12} button:hover{filter:brightness(.98)}
    .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}.brand{padding:6px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}.brand h1{font-size:18px;margin:0 0 6px}.brand p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.nav button{display:flex;align-items:center;gap:9px;width:100%;margin:4px 0;padding:11px 10px;text-align:left;background:#fff;border-color:transparent;color:#34495e}.nav button.active{background:var(--blue-2);border-color:#cfe7f6;color:var(--blue);font-weight:700}.main{min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.topbar h2{font-size:20px;margin:0}.topbar .meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:12px;background:var(--gray);color:var(--muted);border:1px solid var(--line)}.badge.green{background:#edf8f1;color:var(--green);border-color:#ccebd6}.badge.yellow{background:#fff8e8;color:#9a6700;border-color:#f5d38b}.badge.blue{background:var(--blue-2);color:var(--blue);border-color:#cfe7f6}.badge.red{background:#fff1f1;color:var(--red);border-color:#f5c2c2}.content{padding:24px 28px 42px}.page{display:none}.page.active{display:block}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.3fr .7fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}.card h3{margin:0 0 12px;font-size:16px}.muted{color:var(--muted)}.kpi .label{color:var(--muted);font-size:13px}.kpi .value{font-size:28px;font-weight:800;margin-top:8px}.kpi .note{font-size:12px;color:var(--teal);margin-top:8px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}.section-title h3{margin:0}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{background:#f8fbfd;color:#526474;font-weight:700}.list{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.patient-info{display:flex;gap:10px;align-items:flex-start}.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue-2);color:var(--blue);display:grid;place-items:center;font-weight:800}.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.data-card{border-left:4px solid var(--teal)}.timeline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.step{padding:8px 10px;border-radius:999px;background:var(--gray);border:1px solid var(--line);font-size:13px}.step.on{background:var(--teal-2);border-color:#bfe4dd;color:#116a60}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.suggestion{border-left:4px solid var(--blue)}.suggestion .btns{display:flex;gap:8px;margin-top:14px}.side-alert{border-left:4px solid var(--warn);background:#fffdf7}.alert-item{padding:10px;border-radius:10px;background:#fff;border:1px solid #f4dfb0;margin-bottom:8px}.danger-note{background:#fff7f7;border:1px solid #f5c2c2;color:#8b1c1c;border-radius:12px;padding:14px;margin:12px 0}.success{display:none;background:#edf8f1;border:1px solid #bfe7cd;color:#276749;border-radius:12px;padding:14px;margin-top:14px}.bars{height:170px;display:flex;align-items:end;gap:12px;padding-top:10px}.bar{flex:1;background:#d8ebf7;border-radius:8px 8px 0 0;position:relative;min-height:30px}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);margin-bottom:5px}.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--green);margin-right:6px}.status-dot.warn{background:var(--warn)}.status-dot.red{background:var(--red)}.footer-note{font-size:13px;color:var(--muted);line-height:1.7}.empty-evidence{border:1px dashed #cbd5df;background:#fbfdff;border-radius:12px;padding:12px;color:#526474}
    @media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.kpis,.two,.three{grid-template-columns:1fr}.topbar{position:relative}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>上海市皮肤病医院</h1><p>专科AI能力中台<br>银屑病专病智能体 · AI治理后台</p></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <header class="topbar"><div><h2 id="pageTitle">AI中台驾驶舱</h2><div class="muted" style="font-size:12px;margin-top:4px">临床AI最小闭环：数据服务 → 工具服务 → 专病知识 → 医生确认 → 治理反馈</div></div><div class="meta"><span class="badge blue">灰度环境</span><span>2026-06-24 10:32</span></div></header>
    <section class="content" id="content"></section>
  </main>
</div>
<script>
const navItems=[['dashboard','AI中台驾驶舱'],['agent','银屑病智能体'],['patient','患者资料'],['advice','AI辅助建议'],['evidence','证据链详情'],['writeback','回写确认'],['governance','智能体治理'],['data','AI数据服务'],['tools','AI工具服务'],['eval','评测报告'],['samples','问题样本库']];
const $=s=>document.querySelector(s); const content=$('#content'); const title=$('#pageTitle');
function badge(t,c='blue'){return `<span class="badge ${c}">${t}</span>`}
function renderNav(active){$('#nav').innerHTML=navItems.map((n,i)=>`<button class="${n[0]===active?'active':''}" onclick="go('${n[0]}')"><span>${['▦','◈','▤','✦','⌁','↩','⚙','▣','◆','✓','!'][i]}</span>${n[1]}</button>`).join('')}
function go(page){renderNav(page); title.textContent=navItems.find(x=>x[0]===page)[1]; content.innerHTML=pages[page](); window.scrollTo(0,0)}
const pages={
 dashboard:()=>`<div class="grid kpis">${[['已上线智能体','5','稳定运行'],['灰度中智能体','2','限定科室'],['今日调用量','326','较昨日 +12%'],['医生采纳率','78.6%','含修改后采纳'],['评测通过率','92.4%','门禁通过'],['回写成功率','98.1%','草稿区回写'],['模型平均响应时间','4.8s','近24小时'],['异常告警数量','3','需处理']].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="note">${x[2]}</div></div>`).join('')}</div><div class="section-title"><h3>运行概况</h3>${badge('全院AI能力监控','green')}</div><div class="grid three"><div class="card"><h3>智能体调用趋势</h3><div class="bars">${[42,55,48,72,66,84,92].map(v=>`<div class="bar" style="height:${v}%"><span>${v}</span></div>`).join('')}</div><p class="footer-note">按日统计调用量，异常时自动降级为人工流程。</p></div><div class="card"><h3>各类智能体运行状态</h3><div class="list">${['银屑病专病智能体｜灰度上线','肿瘤随访智能体｜正式上线','护理宣教智能体｜正式上线','病程管理智能体｜灰度中','科研摘要智能体｜内测'].map((x,i)=>`<div class="row"><span><i class="status-dot ${i==3?'warn':''}"></i>${x}</span>${badge(i==3?'观察':'正常',i==3?'yellow':'green')}</div>`).join('')}</div></div><div class="card"><h3>今日异常告警</h3><div class="list"><div class="danger-note">模型超时 1 次：AI辅助建议暂时无法生成，请稍后重试或按常规流程处理。保留人工编辑入口。</div><div class="alert-item">规则与模型冲突 1 次：优先展示规则提示，模型建议标注需医生复核。</div><div class="alert-item">回写字段映射异常 1 次：已转接口处理。</div></div></div></div>`,
 agent:()=>`<div class="grid two"><div><div class="card"><h3>患者搜索</h3><input class="input" placeholder="输入门诊号/就诊卡号/模拟患者编号" /></div><div class="section-title"><h3>近期复诊患者</h3>${badge('银屑病专病门诊','blue')}</div><div class="list">${['患者A，女，42岁，银屑病复诊，近7日上传皮损图','患者B，男，56岁，系统治疗随访，肝功能异常待复核','患者C，女，35岁，生物制剂治疗前评估，前置检查待补齐'].map((p,i)=>`<div class="row"><div class="patient-info"><div class="avatar">${String.fromCharCode(65+i)}</div><div><b>${p.split('，')[0]}</b><div class="muted">${p}</div></div></div><button class="primary" onclick="go('patient')">进入分析</button></div>`).join('')}</div></div><div class="card side-alert"><h3>高风险患者提醒</h3><div class="alert-item">患者B：ALT异常待复核</div><div class="alert-item">患者C：治疗前筛查待补齐</div><h3 style="margin-top:18px">智能体能力说明</h3><p class="footer-note">基于AI可用数据服务、前置检查校验工具、用药安全规则和银屑病专病知识包，生成只读建议并支持医生确认后回写。</p></div></div>`,
 patient:()=>`<div class="card"><h3>模拟患者：患者A</h3><div class="timeline"><span>年龄：42岁</span><span>诊断：寻常型银屑病</span><span>当前场景：复诊评估</span>${badge('数据完整度 82%','yellow')}</div></div><div class="section-title"><h3>AI可用数据对象</h3>${badge('非原始接口 · 已结构化封装','green')}</div><div class="grid three">${[['患者画像','女性，42岁<br>病程约8年<br>既往系统治疗史<br>近期复诊'],['病情摘要','近3个月皮损反复<br>近期瘙痒加重<br>用药依从性一般'],['用药时间线','外用药：间断使用<br>传统系统治疗：既往使用<br>生物制剂：待评估'],['检验异常','ALT轻度升高<br>CRP略高<br>乙肝筛查资料缺失'],['皮损图像时间轴','2026-05-10 上传<br>2026-06-01 上传<br>图像质量：可用于随访对比'],['资料完整性检查','已有：门诊病历、用药记录、皮损图像、部分检验<br>缺失：乙肝筛查、结核筛查、近期DLQI']].map(x=>`<div class="card data-card"><h3>${x[0]}</h3><p class="footer-note">${x[1]}</p></div>`).join('')}</div><div class="actions"><button class="primary" onclick="go('advice')">生成AI辅助建议</button></div>`,
 advice:()=>`<div class="grid two"><div><div class="card"><h3>银屑病专病智能体｜复诊辅助分析结果</h3><p class="muted">输出内容为只读辅助建议，需医生确认。</p></div>${[['病情摘要卡','患者银屑病病程较长，近期皮损反复并伴瘙痒加重。当前资料提示需进一步补充DLQI及部分治疗前筛查信息，以支持后续治疗方案评估。'],['严重度辅助记录卡','当前资料支持进行PASI/BSA/DLQI补充记录。已上传皮损图像可用于随访对比，但仍需医生确认皮损范围及严重度评分。'],['PsA及系统性共病风险提示卡','建议关注是否存在关节疼痛、晨僵、指趾肿胀等PsA相关症状；同时关注代谢、心血管及情绪相关共病风险。'],['系统治疗/生物制剂用药安全提醒卡','当前存在ALT轻度升高，乙肝筛查及结核筛查资料缺失。若考虑系统治疗或生物制剂，建议补充前置检查并由医生复核。'],['复诊与随访建议卡','建议完善PRO量表、DLQI评分及治疗前筛查资料。若后续调整治疗方案，应同步生成随访计划并纳入患者病程管理。']].map(x=>`<div class="card suggestion" style="margin-top:14px"><h3>${x[0]}</h3><p>${x[1]}</p><div class="btns"><button class="teal">采纳</button><button>修改</button><button class="warn">驳回</button><button onclick="go('evidence')">查看证据</button></div></div>`).join('')}<div class="actions"><button class="primary" onclick="go('writeback')">进入回写确认</button></div></div><aside class="card side-alert"><h3>异常与安全提示</h3>${['规则提示：乙肝筛查缺失，需补充','规则提示：结核筛查缺失，需补充','数据提示：DLQI记录缺失','图像提示：图像质量可用，但需医生确认'].map(x=>`<div class="alert-item">${x}</div>`).join('')}<div class="danger-note">模型超时：AI辅助建议暂时无法生成，请稍后重试或按常规流程处理。<b>保留人工编辑入口</b>。</div><div class="alert-item">规则与模型冲突：优先展示规则提示，模型建议“需医生复核”。</div><div class="empty-evidence">证据链为空：当前建议缺少明确证据来源，仅作为一般性提示，请医生复核。</div><div class="danger-note">图像质量不足：图像质量不足，暂不支持基于该图像生成辅助分析。</div></aside></div>`,
 evidence:()=>`<div class="card"><h3>证据链详情</h3><table class="table"><tbody>${[['当前建议','系统治疗/生物制剂用药安全提醒'],['命中知识包','银屑病专病知识包 v0.3'],['命中规则','治疗前筛查完整性规则 v0.2'],['知识来源','银屑病诊疗指南/专家共识；药品说明书；院内治疗前筛查路径'],['相关患者依据','ALT轻度升高；乙肝筛查缺失；结核筛查缺失'],['风险等级','黄色，需医生复核'],['证据状态','有明确规则依据']].map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</tbody></table></div><div class="grid four"></div><div class="section-title"><h3>版本与追溯</h3></div><div class="grid kpis">${[['模型版本','医学大模型 v1.2'],['规则版本','用药安全规则 v0.2'],['知识包版本','银屑病知识包 v0.3'],['生成时间','2026-06-24 10:32']].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value" style="font-size:20px">${x[1]}</div></div>`).join('')}</div>`,
 writeback:()=>`<div class="grid two"><div class="card"><h3>待回写内容预览</h3><ul><li>病情摘要</li><li>风险提示</li><li>用药安全提醒</li><li>随访建议</li></ul><h3>回写位置选择</h3><div class="actions">${['病历草稿','复诊摘要','随访计划','护理任务','患者提醒'].map(x=>`<button>${x}</button>`).join('')}</div><div class="danger-note">AI内容不会直接进入正式病历，需医生确认后回写至草稿区，最终签发内容以医生确认版本为准。</div><div class="actions"><button class="primary" onclick="$('#wbSuccess').style.display='block'">确认回写</button><button>暂不回写</button><button onclick="go('advice')">返回修改</button></div><div id="wbSuccess" class="success">已回写至病历草稿，并记录AI生成内容、医生确认人、模型版本、知识包版本和回写时间。</div></div><div class="card"><h3>回写状态机</h3><div class="timeline">${['AI已生成','医生已查看','医生已采纳/修改','待回写','已回写草稿','医生二次修改','已签发/已确认'].map((x,i)=>`<span class="step ${i<5?'on':''}">${x}</span>`).join('')}</div></div></div>`,
 governance:()=>`<div class="grid two"><div class="card"><h3>银屑病专病智能体详情</h3><table class="table"><tbody>${[['智能体名称','银屑病专病智能体'],['状态','灰度上线'],['适用科室','银屑病专病门诊'],['责任人','专病专家组'],['当前版本','v0.5']].map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</tbody></table><h3 style="margin-top:18px">关联能力</h3><p class="footer-note">模型：医学大模型 v1.2，视觉模型 v0.8，规则引擎 v0.3<br>知识包：银屑病知识包 v0.3，用药安全知识包 v0.2<br>工具：患者资料查询、检验异常识别、前置检查校验、用药禁忌校验、回写工具</p></div><div class="card"><h3>运行指标</h3><div class="grid three">${[['今日调用','86'],['采纳率','76.2%'],['修改率','18.4%'],['驳回率','5.4%'],['平均响应','5.2s'],['异常次数','2']].map(x=>`<div><b>${x[1]}</b><div class="muted">${x[0]}</div></div>`).join('')}</div><h3 style="margin-top:18px">操作</h3><div class="actions"><button class="warn">暂停智能体</button><button>回滚版本</button><button onclick="go('eval')">查看评测报告</button><button onclick="go('samples')">查看问题样本</button></div></div></div><div class="card" style="margin-top:16px"><h3>生命周期</h3><div class="timeline">${['需求提出','知识包配置','智能体编排','离线评测','临床内测','灰度上线','医生反馈','指标监控','版本迭代/回滚'].map((x,i)=>`<span class="step ${i<=5?'on':''}">${x}</span>`).join('')}</div></div>`,
 data:()=>`<div class="grid two"><div class="card"><h3>AI可用数据服务层</h3><p class="footer-note">AI中台不让每个智能体直接调用原始业务接口，而是将院内接口统一接入、结构化加工、权限治理和工具化封装，形成可复用的数据服务。</p><table class="table"><thead><tr><th>数据对象</th><th>来源系统</th><th>状态</th><th>调用智能体</th><th>今日调用</th><th>权限</th></tr></thead><tbody>${[['患者画像','HIS/EMR','正常','银屑病/肿瘤/护理','128','按就诊关系'],['病情摘要','EMR','正常','银屑病/科研','96','医生可见'],['用药时间线','HIS/处方','正常','银屑病/护理','75','医生/护士'],['检验异常','LIS','正常','银屑病/护理','89','医生/护士'],['皮损图像时间轴','患者端/PACS','正常','银屑病/病程管理','44','医生可见'],['随访记录','随访系统','部分异常','病程管理/护理','36','授权可见']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="card side-alert"><h3>数据服务监控</h3>${['数据完整性：82%','接口状态：LIS/HIS正常，随访系统部分异常','最近异常：随访记录同步延迟','权限审计：按就诊关系、授权范围记录访问日志'].map(x=>`<div class="alert-item">${x}</div>`).join('')}</div></div>`,
 tools:()=>`<div class="grid three">${[['前置检查完整性校验工具','输入：患者ID、治疗方案类型','输出：缺失检查清单','正常','58','99.1%','0','银屑病智能体','v0.2'],['用药禁忌校验工具','输入：患者病史、过敏史、检验、处方','输出：禁忌提示、风险等级','正常','46','98.7%','1','银屑病/护理','v0.3'],['PASI/BSA/DLQI辅助记录工具','输入：医生评分、患者量表、皮损图像','输出：结构化评分记录','内测','21','95.2%','1','银屑病智能体','v0.1'],['随访计划生成工具','输入：疾病状态、治疗方案、风险等级','输出：随访频率、提醒任务','正常','39','98.9%','0','病程管理','v0.4'],['结果回写工具','输入：医生确认内容、回写目标','输出：回写状态、日志ID','正常','33','98.1%','1','银屑病/护理','v0.2']].map(t=>`<div class="card data-card"><h3>${t[0]}</h3><p class="footer-note">${t[1]}<br>${t[2]}</p><div class="timeline">${badge(t[3],t[3]=='内测'?'yellow':'green')}<span>今日调用 ${t[4]}</span><span>成功率 ${t[5]}</span><span>失败 ${t[6]}</span><span>${t[7]}</span><span>${t[8]}</span></div></div>`).join('')}</div>`,
 eval:()=>`<div class="card"><h3>评测报告</h3><p>评测对象：银屑病专病智能体 v0.5<br>评测集：银屑病复诊辅助评测集 v0.2<br>测试样本：120例<br>评测时间：2026-06-24</p><table class="table"><tbody>${[['病情摘要一致性','88.5%'],['用药禁忌识别召回率','高召回优先，专家复核通过'],['证据链展示率','96.8%'],['医生反馈记录率','100%'],['回写确认留痕率','100%'],['平均响应时间','5.2s'],['异常降级通过率','92.0%']].map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</tbody></table><div class="danger-note">上线结论：建议继续灰度试用，限定银屑病专病门诊、限定医生组、只读建议 + 医生确认回写。</div><h3>风险项</h3><ul><li>部分资料缺失场景下建议过于完整</li><li>图像质量不足提示需优化</li><li>个别证据链命中不够精确</li></ul></div>`,
 samples:()=>`<div class="grid two"><div class="card"><h3>问题样本库</h3><table class="table"><thead><tr><th>样本ID</th><th>来源</th><th>问题类型</th><th>智能体</th><th>医生反馈</th><th>处理状态</th><th>优化方向</th></tr></thead><tbody>${[['S001','医生驳回','证据不足','银屑病智能体','建议补充指南依据','待知识包更新','知识包补充'],['S002','规则冲突','用药安全','银屑病智能体','规则提示禁用但模型建议可用','已进入规则复核','规则优先级优化'],['S003','图像质量不足','皮损图像','病程管理','医生反馈图像角度不一致','待优化图像提示','图像质量提示'],['S004','回写失败','病历草稿','银屑病智能体','字段映射异常','已转接口处理','回写映射修复']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="card side-alert"><h3>反馈闭环指标</h3>${[['待处理样本数量','12'],['已闭环样本数量','48'],['本周新增问题','7'],['知识包待更新','3'],['规则待优化','2']].map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div>`
};
go('dashboard');
